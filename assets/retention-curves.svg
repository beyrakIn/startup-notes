<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1040" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="1040" height="6" fill="#F1592A"/>

  <text x="520" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#1A1A1A">Retention is the macro signal</text>
  <text x="520" y="90" text-anchor="middle" font-size="16" fill="#8A94A6">Cohort = the % of users who came on day one and keep coming back</text>

  <!-- Axes -->
  <line x1="120" y1="150" x2="120" y2="470" stroke="#D8DCE4" stroke-width="2"/>
  <line x1="120" y1="470" x2="900" y2="470" stroke="#D8DCE4" stroke-width="2"/>
  <text x="92" y="310" text-anchor="middle" font-size="14" fill="#8A94A6" transform="rotate(-90 92 310)">% still active</text>
  <text x="510" y="512" text-anchor="middle" font-size="14" fill="#8A94A6">Time since first use  →</text>
  <!-- y ticks -->
  <text x="110" y="166" text-anchor="end" font-size="12" fill="#B4BCC9">100%</text>
  <text x="110" y="474" text-anchor="end" font-size="12" fill="#B4BCC9">0%</text>

  <!-- start dot (everyone shares 100% at period 0) -->
  <circle cx="120" cy="160" r="6" fill="#1A1A1A"/>

  <!-- BAD: crashes to ~0 -->
  <path d="M120 160 C150 360 200 455 320 463 C480 470 700 469 900 469" fill="none" stroke="#B8C0CE" stroke-width="5" stroke-linecap="round"/>
  <text x="360" y="452" font-size="15" font-weight="700" fill="#9AA3B2">bad — nobody comes back</text>

  <!-- GOOD: drops then plateaus mid -->
  <path d="M120 160 C170 250 250 320 360 332 C520 348 700 344 900 344" fill="none" stroke="#F6A07A" stroke-width="5" stroke-linecap="round"/>
  <text x="700" y="334" font-size="15" font-weight="700" fill="#E07B45">good — flattens</text>

  <!-- GREAT: higher plateau, ticks up (smile) -->
  <path d="M120 160 C175 205 250 250 360 250 C540 250 720 236 900 214" fill="none" stroke="#F1592A" stroke-width="5.5" stroke-linecap="round"/>
  <text x="700" y="200" font-size="15" font-weight="700" fill="#F1592A">great — smiles up</text>

  <!-- plateau annotation -->
  <line x1="610" y1="344" x2="610" y2="250" stroke="#C2CAD6" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="540" y="408" font-size="13" fill="#5A6475">the plateau =</text>
  <text x="540" y="426" font-size="13" font-weight="700" fill="#1A1A1A">your core customers</text>

  <text x="520" y="544" text-anchor="middle" font-size="14" fill="#8A94A6">Leading indicators while you wait for the curve: 5-star reviews and NPS. Up = good · flat = build new things · down = bad.</text>
</svg>
