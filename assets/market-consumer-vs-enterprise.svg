<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1040" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="1040" height="6" fill="#F1592A"/>

  <text x="520" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#1A1A1A">Why enterprise: the market delta</text>
  <text x="520" y="88" text-anchor="middle" font-size="16" fill="#8A94A6">Annual spend, drawn to scale — enterprise IT dwarfs the entire consumer market</text>

  <!-- baseline -->
  <line x1="120" y1="470" x2="920" y2="470" stroke="#D8DCE4" stroke-width="2"/>

  <!-- Enterprise bar (340px = $3.7T) -->
  <rect x="660" y="130" width="180" height="340" fill="#F1592A"/>
  <text x="750" y="118" text-anchor="middle" font-size="22" font-weight="800" fill="#F1592A">$3.7T</text>
  <text x="750" y="494" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A">Enterprise IT / yr</text>
  <text x="750" y="514" text-anchor="middle" font-size="12.5" fill="#8A94A6">buy productivity &amp; value</text>

  <!-- Consumer bar (to scale: 340 * 170/3700 ≈ 16px) -->
  <rect x="200" y="454" width="180" height="16" fill="#B8C0CE"/>
  <text x="290" y="444" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6475">$170B</text>
  <text x="290" y="494" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A">Consumer / yr</text>
  <text x="290" y="514" text-anchor="middle" font-size="12.5" fill="#8A94A6">apps $35B + ads $135B · pushed toward free</text>

  <!-- multiplier callout -->
  <path d="M400 360 C500 360 560 360 650 360" fill="none" stroke="#C2CAD6" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <text x="520" y="345" text-anchor="middle" font-size="26" font-weight="800" fill="#1A1A1A">≈ 22×</text>
  <text x="520" y="392" text-anchor="middle" font-size="13" fill="#8A94A6">larger market</text>

  <text x="520" y="538" text-anchor="middle" font-size="14" fill="#8A94A6">Consumers conserve limited money; enterprises spend to get value. The whole consumer market is the thin gray sliver.</text>
</svg>
