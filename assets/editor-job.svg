<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1040" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="1040" height="6" fill="#F1592A"/>

  <text x="520" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#1A1A1A">Your job is an editor</text>
  <text x="520" y="88" text-anchor="middle" font-size="16" fill="#8A94A6">Writers do most of the work — your job is to edit it, in four ways</text>

  <!-- Card 1: Simplify -->
  <rect x="120" y="120" width="380" height="150" rx="14" fill="#FFF8F5" stroke="#F1592A" stroke-width="1.5"/>
  <circle cx="158" cy="158" r="15" fill="#F1592A"/><text x="158" y="163" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
  <text x="186" y="163" font-size="19" font-weight="700" fill="#1A1A1A">Simplify</text>
  <text x="148" y="198" font-size="13.5" fill="#5A6475">Take the red pen and omit. Distill to</text>
  <text x="148" y="218" font-size="13.5" fill="#5A6475">1–3 things people can repeat.</text>
  <text x="148" y="244" font-size="12.5" font-style="italic" fill="#C2552E">Don't accept the excuse of complexity.</text>

  <!-- Card 2: Clarifying questions -->
  <rect x="540" y="120" width="380" height="150" rx="14" fill="#FFF8F5" stroke="#F1592A" stroke-width="1.5"/>
  <circle cx="578" cy="158" r="15" fill="#F1592A"/><text x="578" y="163" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
  <text x="606" y="163" font-size="19" font-weight="700" fill="#1A1A1A">Ask clarifying questions</text>
  <text x="568" y="198" font-size="13.5" fill="#5A6475">Narrow to the few things that matter</text>
  <text x="568" y="218" font-size="13.5" fill="#5A6475">most — and decide fast.</text>
  <text x="568" y="244" font-size="12.5" font-style="italic" fill="#C2552E">Each step cut ≈ +30–50% performance.</text>

  <!-- Card 3: Allocate resources -->
  <rect x="120" y="294" width="380" height="150" rx="14" fill="#FFF8F5" stroke="#F1592A" stroke-width="1.5"/>
  <circle cx="158" cy="332" r="15" fill="#F1592A"/><text x="158" y="337" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
  <text x="186" y="337" font-size="19" font-weight="700" fill="#1A1A1A">Allocate resources</text>
  <text x="148" y="372" font-size="13.5" fill="#5A6475">Top-down and bottom-up — people</text>
  <text x="148" y="392" font-size="13.5" fill="#5A6475">should pitch their own initiatives.</text>
  <text x="148" y="418" font-size="12.5" font-style="italic" fill="#C2552E">Use less red ink every month.</text>

  <!-- Card 4: Consistent voice -->
  <rect x="540" y="294" width="380" height="150" rx="14" fill="#FFF8F5" stroke="#F1592A" stroke-width="1.5"/>
  <circle cx="578" cy="332" r="15" fill="#F1592A"/><text x="578" y="337" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
  <text x="606" y="337" font-size="19" font-weight="700" fill="#1A1A1A">Ensure one voice</text>
  <text x="568" y="372" font-size="13.5" fill="#5A6475">Site, PR, packaging, recruiting,</text>
  <text x="568" y="392" font-size="13.5" fill="#5A6475">support — all feel written by one person.</text>
  <text x="568" y="418" font-size="12.5" font-style="italic" fill="#C2552E">Like every page of The Economist.</text>

  <text x="520" y="492" text-anchor="middle" font-size="14.5" fill="#5A6475">Maximize the output of your org — and measure output, not motion.</text>
  <text x="520" y="524" text-anchor="middle" font-size="14" fill="#8A94A6">"Build a company idiots could run, because eventually they will." — Buffett</text>
</svg>
