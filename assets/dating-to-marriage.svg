<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1040" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="1040" height="6" fill="#F1592A"/>

  <text x="520" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#1A1A1A">Build products users love like a relationship</text>
  <text x="520" y="90" text-anchor="middle" font-size="16" fill="#8A94A6">New users = dating · existing users = a marriage</text>

  <!-- Dating panel -->
  <g>
    <rect x="70" y="130" width="410" height="350" rx="16" fill="#FFF8F5" stroke="#F1592A" stroke-width="1.5"/>
    <text x="275" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#F1592A">Dating — new users</text>
    <text x="275" y="200" text-anchor="middle" font-size="13" font-style="italic" fill="#9AA3B2">first impressions you retell forever</text>

    <g font-size="14.5" fill="#1A1A1A">
      <circle cx="104" cy="234" r="4" fill="#F1592A"/>
      <text x="120" y="239" font-weight="700">Low pass/fail threshold</text>
      <text x="120" y="261" font-size="13" fill="#5A6475">one bad first moment ends it</text>

      <circle cx="104" cy="296" r="4" fill="#F1592A"/>
      <text x="120" y="301" font-weight="700">Seduce every first moment</text>
      <text x="120" y="323" font-size="13" fill="#5A6475">first email · login · 404 · first reply</text>

      <circle cx="104" cy="358" r="4" fill="#F1592A"/>
      <text x="120" y="363" font-weight="700">Enchanting &gt; functional</text>
      <text x="120" y="385" font-size="13" fill="#5A6475">miryokuteki, not just atarimae</text>

      <circle cx="104" cy="420" r="4" fill="#F1592A"/>
      <text x="120" y="425" font-weight="700">Make them want to tell the story</text>
      <text x="120" y="447" font-size="13" fill="#5A6475">"I'm programming for a battle axe"</text>
    </g>
  </g>

  <!-- arrow -->
  <path d="M492 305 h56" stroke="#C2CAD6" stroke-width="3" stroke-linecap="round"/>
  <path d="M548 305 l-13 -7 l0 14 z" fill="#C2CAD6"/>

  <!-- Marriage panel -->
  <g>
    <rect x="560" y="130" width="410" height="350" rx="16" fill="#FFF8F5" stroke="#F1592A" stroke-width="1.5"/>
    <text x="765" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#F1592A">Marriage — existing users</text>
    <text x="765" y="200" text-anchor="middle" font-size="13" font-style="italic" fill="#9AA3B2">how you fight predicts the whole system</text>

    <g font-size="14.5" fill="#1A1A1A">
      <circle cx="594" cy="234" r="4" fill="#F1592A"/>
      <text x="610" y="239" font-weight="700">Everyone fights the same fights</text>
      <text x="610" y="261" font-size="13" fill="#5A6475">money · kids · sex · time · others → support</text>

      <circle cx="594" cy="296" r="4" fill="#F1592A"/>
      <text x="610" y="301" font-weight="700">Avoid the Four Horsemen</text>
      <text x="610" y="323" font-size="13" fill="#5A6475">criticism · contempt · defensiveness · stonewalling</text>

      <circle cx="594" cy="358" r="4" fill="#F1592A"/>
      <text x="610" y="363" font-weight="700">Everyone does support (SDD)</text>
      <text x="610" y="385" font-size="13" fill="#5A6475">builders feel the consequences</text>

      <circle cx="594" cy="420" r="4" fill="#F1592A"/>
      <text x="610" y="425" font-weight="700">Keep putting energy back in</text>
      <text x="610" y="447" font-size="13" fill="#5A6475">"since you've been gone" · thank-you cards</text>
    </g>
  </g>

  <text x="520" y="524" text-anchor="middle" font-size="14" fill="#8A94A6">Stonewalling — not replying — is the worst, and a top cause of early churn.</text>
</svg>
