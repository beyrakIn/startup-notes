<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1040" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="1040" height="6" fill="#F1592A"/>

  <text x="520" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#1A1A1A">The founder's sales funnel</text>
  <text x="520" y="88" text-anchor="middle" font-size="16" fill="#8A94A6">You are the salesperson — passion + industry knowledge beat sales experience</text>

  <!-- funnel stages (left), tactic (right) -->
  <!-- Stage 1 Prospecting -->
  <path d="M70 128 L470 128 L430 188 L110 188 Z" fill="#FDE7DC"/>
  <text x="270" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#5A6475">1 · Prospecting</text>
  <line x1="490" y1="158" x2="520" y2="158" stroke="#E2E6ED" stroke-width="2"/>
  <text x="534" y="152" font-size="13.5" font-weight="700" fill="#1A1A1A">Who'll even take your call?</text>
  <text x="534" y="172" font-size="12.5" fill="#5A6475">only ~2.5% (innovators) → numbers game</text>
  <text x="534" y="190" font-size="12.5" fill="#5A6475">network · conferences · short cold email</text>

  <!-- Stage 2 Conversations -->
  <path d="M110 196 L430 196 L390 256 L150 256 Z" fill="#F8B597"/>
  <text x="270" y="233" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">2 · Conversations</text>
  <line x1="450" y1="226" x2="520" y2="226" stroke="#E2E6ED" stroke-width="2"/>
  <text x="534" y="220" font-size="13.5" font-weight="700" fill="#1A1A1A">Shut up.</text>
  <text x="534" y="240" font-size="12.5" fill="#5A6475">talk 30%, listen 70% — understand</text>
  <text x="534" y="258" font-size="12.5" fill="#5A6475">their problem better than they do</text>

  <!-- Stage 3 Closing -->
  <path d="M150 264 L390 264 L350 324 L190 324 Z" fill="#F2855B"/>
  <text x="270" y="301" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3 · Closing</text>
  <line x1="410" y1="294" x2="520" y2="294" stroke="#E2E6ED" stroke-width="2"/>
  <text x="534" y="288" font-size="13.5" font-weight="700" fill="#1A1A1A">Sign &amp; move on.</text>
  <text x="534" y="308" font-size="12.5" fill="#5A6475">force a yes/no (maybes kill you)</text>
  <text x="534" y="326" font-size="12.5" fill="#5A6475">avoid the "one more feature" &amp; free-trial traps</text>

  <!-- Stage 4 Revenue -->
  <path d="M190 332 L350 332 L320 392 L220 392 Z" fill="#F1592A"/>
  <text x="270" y="369" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">4 · Revenue</text>
  <line x1="372" y1="362" x2="520" y2="362" stroke="#E2E6ED" stroke-width="2"/>
  <text x="534" y="356" font-size="13.5" font-weight="700" fill="#C2552E">Reference customers + validation.</text>
  <text x="534" y="376" font-size="12.5" fill="#5A6475">match price to sales touch:</text>
  <text x="534" y="394" font-size="12.5" fill="#5A6475">$100k elephants · $10k deer · $1k rabbits</text>

  <text x="520" y="452" text-anchor="middle" font-size="14.5" fill="#5A6475">Follow up with superhuman persistence — but spend it getting people to a fast yes or no.</text>
  <text x="520" y="492" text-anchor="middle" font-size="14" fill="#8A94A6">This is the under-documented zero-to-$1M stage. You can figure it out by doing it.</text>
</svg>
