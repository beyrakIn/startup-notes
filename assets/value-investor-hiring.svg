<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1040" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="1040" height="6" fill="#F1592A"/>

  <text x="520" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#1A1A1A">Hire like a value investor</text>
  <text x="520" y="88" text-anchor="middle" font-size="16" fill="#8A94A6">Find human capital the market undervalues — relax how apparent the talent is, never the talent</text>

  <!-- quadrant area: x 200..760, y 140..440 -->
  <!-- quadrant fills -->
  <rect x="200" y="140" width="280" height="150" fill="#F4F6F9"/>
  <rect x="480" y="140" width="280" height="150" fill="#FDE7DC"/>
  <rect x="200" y="290" width="280" height="150" fill="#F4F6F9"/>
  <rect x="480" y="290" width="280" height="150" fill="#F1592A"/>

  <!-- axes -->
  <line x1="200" y1="140" x2="200" y2="440" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="200" y1="440" x2="760" y2="440" stroke="#1A1A1A" stroke-width="2"/>
  <text x="480" y="478" text-anchor="middle" font-size="14" font-weight="600" fill="#5A6475">Talent  →</text>
  <text x="176" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#5A6475" transform="rotate(-90 176 290)">How obvious to the market  →</text>

  <!-- quadrant labels -->
  <text x="340" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#9AA3B2">overhyped</text>
  <text x="340" y="232" text-anchor="middle" font-size="12.5" fill="#B4BCC9">pass</text>

  <text x="620" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#C2552E">discovered stars</text>
  <text x="620" y="222" text-anchor="middle" font-size="12.5" fill="#5A6475">expensive · hard to convince</text>
  <text x="620" y="240" text-anchor="middle" font-size="12.5" fill="#5A6475">(Google / Facebook)</text>

  <text x="340" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#9AA3B2">unknown &amp; unproven</text>
  <text x="340" y="382" text-anchor="middle" font-size="12.5" fill="#B4BCC9">pass</text>

  <text x="620" y="346" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">★ UNDERVALUED</text>
  <text x="620" y="370" text-anchor="middle" font-size="12.5" fill="#ffffff">talented, not yet obvious —</text>
  <text x="620" y="388" text-anchor="middle" font-size="12.5" fill="#ffffff">go here</text>
  <text x="620" y="412" text-anchor="middle" font-size="11.5" fill="#FFD9C9">18-yo designer · college CTO · your users</text>

  <text x="520" y="512" text-anchor="middle" font-size="14" fill="#8A94A6">Better test than "10×": is this the best engineer this engineer knows?</text>
</svg>
