<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1040" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="1040" height="6" fill="#F1592A"/>

  <!-- Header -->
  <text x="520" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#1A1A1A">The Four Pillars of a Great Startup</text>
  <text x="520" y="94" text-anchor="middle" font-size="16" fill="#8A94A6">Sam Altman · How to Start a Startup (Stanford CS183B)</text>

  <!-- ===== Cards ===== -->
  <!-- Card 1: Idea -->
  <g>
    <rect x="44" y="130" width="220" height="280" rx="16" fill="#FFF8F5" stroke="#F1592A" stroke-width="1.5"/>
    <text x="74" y="186" font-size="44" font-weight="800" fill="#F1592A">1</text>
    <!-- lightbulb -->
    <g stroke="#F1592A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="154" cy="238" r="22"/>
      <line x1="146" y1="266" x2="162" y2="266"/>
      <line x1="148" y1="274" x2="160" y2="274"/>
      <line x1="151" y1="281" x2="157" y2="281"/>
      <line x1="154" y1="200" x2="154" y2="192"/>
      <line x1="182" y1="212" x2="189" y2="206"/>
      <line x1="126" y1="212" x2="119" y2="206"/>
    </g>
    <text x="154" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#1A1A1A">Idea</text>
    <text x="154" y="378" text-anchor="middle" font-size="13" fill="#8A94A6">Mission-driven.</text>
    <text x="154" y="396" text-anchor="middle" font-size="13" fill="#8A94A6">Hard to replicate.</text>
  </g>

  <!-- Card 2: Product -->
  <g>
    <rect x="288" y="130" width="220" height="280" rx="16" fill="#FFF8F5" stroke="#F1592A" stroke-width="1.5"/>
    <text x="318" y="186" font-size="44" font-weight="800" fill="#F1592A">2</text>
    <!-- box -->
    <g stroke="#F1592A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M374 246 L388 230 L436 230 L422 246 Z"/>
      <path d="M374 246 L374 282 L422 282 L422 246 Z"/>
      <path d="M422 246 L436 230 L436 266 L422 282"/>
    </g>
    <text x="398" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#1A1A1A">Product</text>
    <text x="398" y="378" text-anchor="middle" font-size="13" fill="#8A94A6">A few users who</text>
    <text x="398" y="396" text-anchor="middle" font-size="13" fill="#8A94A6">love it.</text>
  </g>

  <!-- Card 3: Team -->
  <g>
    <rect x="532" y="130" width="220" height="280" rx="16" fill="#FFF8F5" stroke="#F1592A" stroke-width="1.5"/>
    <text x="562" y="186" font-size="44" font-weight="800" fill="#F1592A">3</text>
    <!-- people -->
    <g stroke="#F1592A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="642" cy="230" r="13"/>
      <path d="M623 280 Q642 246 661 280"/>
      <circle cx="613" cy="244" r="10"/>
      <path d="M599 282 Q613 256 624 276"/>
      <circle cx="671" cy="244" r="10"/>
      <path d="M660 276 Q671 256 685 282"/>
    </g>
    <text x="642" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#1A1A1A">Team</text>
    <text x="642" y="378" text-anchor="middle" font-size="13" fill="#8A94A6">Hire slow. Never</text>
    <text x="642" y="396" text-anchor="middle" font-size="13" fill="#8A94A6">mediocre.</text>
  </g>

  <!-- Card 4: Execution -->
  <g>
    <rect x="776" y="130" width="220" height="280" rx="16" fill="#FFF8F5" stroke="#F1592A" stroke-width="1.5"/>
    <text x="806" y="186" font-size="44" font-weight="800" fill="#F1592A">4</text>
    <!-- gears -->
    <g stroke="#F1592A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="878" cy="242" r="17"/>
      <circle cx="878" cy="242" r="6"/>
      <line x1="878" y1="225" x2="878" y2="218"/>
      <line x1="878" y1="259" x2="878" y2="266"/>
      <line x1="895" y1="242" x2="902" y2="242"/>
      <line x1="861" y1="242" x2="854" y2="242"/>
      <line x1="890" y1="230" x2="895" y2="225"/>
      <line x1="866" y1="254" x2="861" y2="259"/>
      <line x1="890" y1="254" x2="895" y2="259"/>
      <line x1="866" y1="230" x2="861" y2="225"/>
      <circle cx="908" cy="266" r="12"/>
      <circle cx="908" cy="266" r="4"/>
      <line x1="908" y1="254" x2="908" y2="249"/>
      <line x1="908" y1="278" x2="908" y2="283"/>
      <line x1="920" y1="266" x2="925" y2="266"/>
      <line x1="896" y1="266" x2="891" y2="266"/>
    </g>
    <text x="886" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#1A1A1A">Execution</text>
    <text x="886" y="378" text-anchor="middle" font-size="13" fill="#8A94A6">Focus + intensity.</text>
    <text x="886" y="396" text-anchor="middle" font-size="13" fill="#8A94A6">Keep momentum.</text>
  </g>

  <!-- ===== Formula ===== -->
  <rect x="44" y="446" width="952" height="78" rx="14" fill="#1A1A1A"/>
  <text x="520" y="480" text-anchor="middle" font-size="15" fill="#8A94A6">The outcome is a product — a zero anywhere sinks it</text>
  <text x="520" y="508" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">outcome = idea <tspan fill="#F1592A">×</tspan> product <tspan fill="#F1592A">×</tspan> team <tspan fill="#F1592A">×</tspan> execution <tspan fill="#F1592A">×</tspan> luck <tspan fill="#8A94A6" font-weight="400" font-size="15">(0–10,000)</tspan></text>
</svg>
